<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script>
        window.addEventListener('error', function(e) {
            var div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = '#FF2D55';
            div.style.color = '#FFFFFF';
            div.style.padding = '20px';
            div.style.zIndex = '999999';
            div.style.fontSize = '14px';
            div.style.fontFamily = 'monospace';
            div.style.whiteSpace = 'pre-wrap';
            div.innerHTML = '<h3>🚨 JS Runtime Error:</h3>' + e.message + '\n at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n\nStack:\n' + (e.error ? e.error.stack : 'N/A');
            document.body.appendChild(div);
        });
        window.addEventListener('unhandledrejection', function(e) {
            var div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = '#FF9500';
            div.style.color = '#FFFFFF';
            div.style.padding = '20px';
            div.style.zIndex = '999999';
            div.style.fontSize = '14px';
            div.style.fontFamily = 'monospace';
            div.style.whiteSpace = 'pre-wrap';
            div.innerHTML = '<h3>🚨 Unhandled Rejection:</h3>' + e.reason + '\n\nStack:\n' + (e.reason ? e.reason.stack : 'N/A');
            document.body.appendChild(div);
        });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ODYSSEY — Personal Journey System</title>
    <meta name="description" content="ODYSSEY: A personal life journey system where users transform goals into quests, actions into progress, and progress into identity." />
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#5856D6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ODYSSEY" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="root"></div>

    <!-- React 18 CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('[Service Worker] Registered successfully', reg.scope))
                    .catch((err) => console.log('[Service Worker] Registration failed', err));
            });
        }
    </script>

    <!-- App Logic -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
